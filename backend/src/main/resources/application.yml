spring:
  application:
    name: dimos-wms
  datasource:
    url: jdbc:postgresql://localhost:5432/wms_dev?currentSchema=wms
    username: wms_app
    password: ${WMS_DB_APP_PASSWORD}
  flyway:
    user: wms_owner
    password: ${WMS_DB_OWNER_PASSWORD}
    schemas: wms
    default-schema: wms
    locations: classpath:db/migration/common,classpath:db/migration/postgresql
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    # /actuator/info shows only the build version, build time and git commit - nothing about the machine or environment.
    build:
      enabled: true
    git:
      enabled: true
      mode: simple
    env:
      enabled: false
    java:
      enabled: false
    os:
      enabled: false
    process:
      enabled: false
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: lax
logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
wms:
  security:
    max-failed-attempts: 5
    lockout-minutes: 15
